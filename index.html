<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Five Ps Casework</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: pen, paper and highlighters. A ballpoint-blue bar, a cool desk-grey ground,
   white note sheets; her notes come back highlighted by 5 Ps colour, with a sticky
   "Still missing" column beside the sheet on iPad landscape. */
:root{
  --desk:oklch(95.6% .006 255); --paper:oklch(99.6% .002 255); --paper-edge:oklch(89.5% .009 255);
  --ink:oklch(24% .025 265); --ink-2:oklch(43% .02 265); --ink-3:oklch(52% .016 265);
  --rule:oklch(88.5% .009 255); --pencil:oklch(60% .012 265);
  --pen:oklch(42% .17 266); --pen-text:oklch(42% .17 266); --on-pen:oklch(99% .005 266); --pen-soft:oklch(93.5% .035 266); --pen-deep:oklch(36% .15 266);
  --redpen:oklch(51% .19 27); --redpen-soft:oklch(95.5% .025 27);
  --ok:oklch(47% .11 152); --ok-soft:oklch(94.5% .04 152); --warn:oklch(52% .12 70); --warn-soft:oklch(95% .045 80);
  --hl-pres:oklch(86.5% .075 305); --hl-pred:oklch(93% .15 103); --hl-prec:oklch(86.5% .13 66);
  --hl-perp:oklch(86% .105 355); --hl-prot:oklch(89% .14 148); --hl-pos:oklch(88% .08 228);
  --font:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --t-xs:.8125rem; --t-s:.9375rem; --t-m:1.0625rem; --t-l:1.25rem; --t-xl:1.5rem; --t-xxl:1.875rem;
  --shadow-sheet:0 1px 2px oklch(30% .03 265 / .07),0 10px 28px -14px oklch(30% .03 265 / .22);
  --mask:oklch(93.2% .01 262); --margin-rule:oklch(86% .05 27);
  --bar-h:60px; --brand-hl:oklch(88% .16 103); --brand-ink:oklch(24% .025 265);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:oklch(19% .012 265); --paper:oklch(23.5% .014 265); --paper-edge:oklch(31% .016 265);
  --ink:oklch(94% .008 265); --ink-2:oklch(79% .012 265); --ink-3:oklch(70% .012 265);
  --rule:oklch(32% .015 265); --pencil:oklch(62% .012 265); --mask:oklch(31% .016 265); --margin-rule:oklch(38% .07 27);
  --pen:oklch(45% .16 266); --pen-text:oklch(78% .11 266); --on-pen:oklch(99% .005 266); --pen-soft:oklch(32% .07 266); --pen-deep:oklch(38% .14 266);
  --redpen:oklch(71% .16 27); --redpen-soft:oklch(29% .06 27);
  --ok:oklch(76% .13 152); --ok-soft:oklch(29% .05 152); --warn:oklch(80% .12 80); --warn-soft:oklch(30% .05 80);
  --hl-pres:oklch(40% .085 305); --hl-pred:oklch(44% .085 100); --hl-prec:oklch(43% .095 60);
  --hl-perp:oklch(41% .095 355); --hl-prot:oklch(42% .09 150); --hl-pos:oklch(41% .075 232);
  --shadow-sheet:0 1px 2px oklch(5% 0 0 / .4),0 10px 28px -14px oklch(5% 0 0 / .6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:oklch(19% .012 265); --paper:oklch(23.5% .014 265); --paper-edge:oklch(31% .016 265);
  --ink:oklch(94% .008 265); --ink-2:oklch(79% .012 265); --ink-3:oklch(70% .012 265);
  --rule:oklch(32% .015 265); --pencil:oklch(62% .012 265); --mask:oklch(31% .016 265); --margin-rule:oklch(38% .07 27);
  --pen:oklch(45% .16 266); --pen-text:oklch(78% .11 266); --on-pen:oklch(99% .005 266); --pen-soft:oklch(32% .07 266); --pen-deep:oklch(38% .14 266);
  --redpen:oklch(71% .16 27); --redpen-soft:oklch(29% .06 27);
  --ok:oklch(76% .13 152); --ok-soft:oklch(29% .05 152); --warn:oklch(80% .12 80); --warn-soft:oklch(30% .05 80);
  --hl-pres:oklch(40% .085 305); --hl-pred:oklch(44% .085 100); --hl-prec:oklch(43% .095 60);
  --hl-perp:oklch(41% .095 355); --hl-prot:oklch(42% .09 150); --hl-pos:oklch(41% .075 232);
  --shadow-sheet:0 1px 2px oklch(5% 0 0 / .4),0 10px 28px -14px oklch(5% 0 0 / .6);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--pencil) transparent}
body{background:var(--desk);color:var(--ink);font:400 var(--t-m)/1.5 var(--font);-webkit-font-smoothing:antialiased;caret-color:var(--pen-text)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--pen)}
::selection{background:var(--hl-pred);color:var(--ink)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:700;letter-spacing:-.005em}
h1{font-size:var(--t-xxl)} h2{font-size:var(--t-xl)} h3{font-size:var(--t-l)}
p{margin:0}
a{color:var(--pen-text);text-underline-offset:.18em;text-decoration-thickness:1px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--pen-text);outline-offset:2px;border-radius:6px}
.small{font-size:var(--t-s)} .xs{font-size:var(--t-xs)} .muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.grow{flex:1 1 auto;min-width:0}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pen);color:var(--on-pen)}
.bar-in{max-width:1280px;margin:0 auto;min-height:var(--bar-h);display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:700;font-size:var(--t-l);white-space:nowrap;display:flex;align-items:center;gap:2px}
.brand mark{background:linear-gradient(transparent 30%,var(--brand-hl) 30%,var(--brand-hl) 88%,transparent 88%);color:var(--brand-ink);padding:0 .12em;border-radius:3px}
.bar .case-id{display:flex;align-items:baseline;gap:8px;min-width:0;font-weight:700;font-size:var(--t-l)}
.bar .case-id span{font-weight:400;font-size:var(--t-m);opacity:.85;white-space:nowrap}
.bar .case-id b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-btn .wide{display:none} @media (min-width:600px){.bar-btn .wide{display:inline}}
.bar-btn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:8px 14px;border-radius:10px;border:1px solid oklch(100% 0 0 / .28);background:transparent;color:var(--on-pen);font-weight:700;font-size:var(--t-s)}
.bar-btn:hover{background:oklch(100% 0 0 / .1)}
.bar-btn.icon-only{padding:0;border-color:transparent}
.save-state{font-size:var(--t-xs);opacity:.85;white-space:nowrap}

/* Page */
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.notice{font-size:var(--t-xs);color:var(--ink-2);padding-top:28px;border-top:1px solid var(--rule);margin-top:40px;max-width:72ch}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font-weight:700;font-size:var(--t-s);line-height:1.2;text-decoration:none;transition:background-color .15s ease,border-color .15s ease}
.btn:hover{border-color:var(--pencil)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn.primary:hover{background:var(--pen-deep);border-color:var(--pen-deep)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--pen-text);padding-inline:10px}
.btn.quiet:hover{background:var(--pen-soft)}
.btn.danger{color:var(--redpen)}
.btn.sm{min-height:38px;padding:6px 12px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.is-busy{cursor:progress}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;background:var(--paper);overflow:hidden}
.seg button{border:0;background:transparent;min-height:40px;padding:6px 14px;font-weight:700;font-size:var(--t-s);color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--pen);color:var(--on-pen)}

/* Fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:var(--t-s);font-weight:700;color:var(--ink-2)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);font-size:var(--t-m)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
textarea{resize:vertical;line-height:1.55}
select{appearance:auto}

/* Tabs */
.case-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;min-height:48px;padding:10px 16px;font-weight:700;font-size:var(--t-m);color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen)}
.tab .count{font-variant-numeric:tabular-nums;font-weight:700;font-size:var(--t-xs);min-width:24px;padding:1px 7px;border-radius:999px;background:var(--pen-soft);color:var(--pen-text)}
.tab .count.risk{background:var(--redpen-soft);color:var(--redpen)}
.panel{padding-top:24px}

/* Safety strip */
.safety{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:10px;background:var(--redpen-soft);color:var(--ink);margin-top:16px}
.safety .icon{color:var(--redpen);margin-top:2px}
.safety b{color:var(--redpen)}
.safety .lines{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:var(--t-s);margin-top:4px}
.safety .lines span{white-space:nowrap}
.safety.calm{background:transparent;padding:4px 0;border-radius:0}
@media (max-width:599px){.safety{flex-wrap:wrap}.safety>.grow{flex:1 1 calc(100% - 40px)}.safety>.btn{margin-left:36px}}

/* Notes grid */
.notes-grid{display:grid;gap:28px;grid-template-columns:minmax(0,1fr);grid-template-areas:"add" "sheets" "gaps"}
.area-add{grid-area:add;min-width:0} .area-gaps{grid-area:gaps;min-width:0} .area-sheets{grid-area:sheets;min-width:0}
@media (min-width:960px){
  .notes-grid{grid-template-columns:minmax(0,1fr) minmax(300px,360px);grid-template-areas:"add gaps" "sheets gaps";align-items:start;column-gap:36px}
  .area-gaps{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 16px);max-height:calc(100vh - var(--bar-h) - 40px);overflow:auto;padding-right:4px}
}

/* Paper sheets */
.sheet{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 16px);background:var(--paper);border:1px solid var(--paper-edge);border-radius:4px;box-shadow:var(--shadow-sheet);padding:20px 22px}
.sheet-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--rule)}
.sheet-head h3{font-size:var(--t-m)}
.sheet-body{font-size:var(--t-m);line-height:1.85;max-width:75ch;overflow-wrap:anywhere}
.sheet-body.ruled{position:relative;padding-left:26px;margin-left:-8px}
.sheet-body.ruled::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:1px;background:var(--margin-rule)}
.rmark{position:absolute;left:3px;width:5px;height:1.15em;margin-top:.3em;border-radius:2px;background:var(--redpen)}
.add-more{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:12px 20px;text-align:left;background:var(--paper);border:1px solid var(--paper-edge);border-radius:4px;box-shadow:var(--shadow-sheet);color:var(--pen-text);font:700 var(--t-m)/1.3 var(--font);cursor:pointer}
.add-more:hover{border-color:var(--pencil)}
.dedication{font-style:italic;font-size:var(--t-m);color:var(--ink-2);margin:0 0 20px;text-wrap:balance}
.dedication mark{background:linear-gradient(transparent 34%,var(--hl-perp) 34%,var(--hl-perp) 90%,transparent 90%);color:var(--ink);padding:0 .12em;border-radius:3px}
mark{background-color:transparent;color:inherit}
.paste.compact{min-height:96px}
.paste{min-height:220px;border:0;padding:0;background:transparent;border-radius:0;font-size:var(--t-m);line-height:1.7}
.paste:focus-visible{outline:none}
.sheet:focus-within{border-color:var(--pencil)}
.add-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}

/* Highlights */
.hl{--hlc:transparent;background-image:linear-gradient(var(--hlc),var(--hlc));background-repeat:no-repeat;background-size:100% 84%;background-position:0 72%;border-radius:.28em;padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone;cursor:pointer;border:0;color:inherit;font:inherit;text-align:left}
.hl:hover{filter:saturate(1.25)}
.c-presenting{--hlc:var(--hl-pres)} .c-predisposing{--hlc:var(--hl-pred)} .c-precipitating{--hlc:var(--hl-prec)}
.c-perpetuating{--hlc:var(--hl-perp)} .c-protective{--hlc:var(--hl-prot)} .c-positive{--hlc:var(--hl-pos)}
.hl.c-risk{background-image:none;text-decoration-line:underline;text-decoration-color:var(--redpen);text-decoration-thickness:2px;text-underline-offset:.22em}
.hl.c-goal{background-image:none;text-decoration-line:underline;text-decoration-style:dotted;text-decoration-color:var(--pen-text);text-decoration-thickness:2px;text-underline-offset:.22em}
.hl.c-context{background-image:none;text-decoration-line:underline;text-decoration-style:dotted;text-decoration-color:var(--pencil);text-decoration-thickness:1px;text-underline-offset:.24em}
.code{font-size:.6em;font-weight:700;letter-spacing:.07em;color:var(--ink-2);vertical-align:.42em;margin:0 .25em 0 .15em;user-select:none;-webkit-user-select:none;white-space:nowrap}
.code.c-risk{color:var(--redpen)} .code.c-goal{color:var(--pen-text)}
.hl.sel{outline:2px solid var(--pen-text);outline-offset:1px}
@media (prefers-reduced-motion:no-preference){
  .hl.sweep{animation:sweep .26s cubic-bezier(.22,.9,.24,1) both;animation-delay:calc(var(--i,0) * 28ms)}
  @keyframes sweep{from{background-size:0% 84%}to{background-size:100% 84%}}
}
.pill{display:inline-flex;align-items:center;padding:0 .4em;margin:0 .05em;border:1px solid transparent;border-radius:5px;font-size:.84em;line-height:1.5;color:var(--ink-2);background:var(--mask);white-space:nowrap;vertical-align:.04em}
button.pill{cursor:pointer;font-family:inherit}
button.pill:hover{border-color:var(--pencil)}
.pill.off{border-style:solid;border-color:var(--rule);background:transparent;color:var(--ink);text-decoration:line-through;text-decoration-color:var(--pencil)}
.word{border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;border-radius:3px}
.word:hover{background:var(--pen-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--t-xs);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{display:inline-block;width:22px;height:11px;border-radius:3px;background:var(--hlc)}
.swatch.c-risk{background:none;border-bottom:2px solid var(--redpen);height:8px;border-radius:0}
.swatch.c-goal{background:none;border-bottom:2px dotted var(--pen-text);height:8px;border-radius:0}

/* Missing column */
.gaps h2{font-size:var(--t-l)}
.meter{display:flex;align-items:center;gap:10px;font-size:var(--t-s);color:var(--ink-2)}
.meter .track{flex:1;height:6px;border-radius:999px;background:var(--rule);overflow:hidden}
.meter .fill{height:100%;background:var(--pen)}
.gap-group{display:flex;flex-direction:column}
.gap-group>h3{font-size:var(--t-s);font-weight:700;color:var(--ink-2);padding:16px 0 6px}
.h-count{display:inline-block;min-width:1.6em;padding:0 .45em;margin-left:4px;border-radius:999px;background:var(--pen-soft);color:var(--pen-text);font-size:var(--t-s);text-align:center;vertical-align:.2em;font-variant-numeric:tabular-nums}
.gap-group>h3.risk{color:var(--redpen)}
.gap{border-top:1px solid var(--rule);padding:12px 0}
.gap:last-child{border-bottom:1px solid var(--rule)}
.gap-row{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:0;color:inherit}
.gap-row .mark{flex:none;width:18px;height:18px;margin-top:3px;border-radius:50%;border:1.5px dashed var(--pencil)}
.gap-row .mark.risk{border:0;color:var(--redpen)}
.gap-row b{font-weight:700;display:block}
.gap-row .hint{font-size:var(--t-s);color:var(--ink-2);display:block;margin-top:2px}
.gap-row .tag{font-size:var(--t-xs);font-weight:700;color:var(--pen-text);white-space:nowrap}
.gap-open{display:flex;flex-direction:column;gap:10px;margin:12px 0 0 28px}
.gap-open textarea{min-height:76px}
.done-list{font-size:var(--t-s);color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:8px}
.done-list span{display:inline-flex;align-items:center;gap:4px}
.done-list .icon{width:16px;height:16px;color:var(--ok)}

/* Board */
.board{columns:1;column-gap:0;column-rule:1px solid var(--rule);background:var(--paper);border:1px solid var(--paper-edge);border-top:0;border-radius:4px;box-shadow:var(--shadow-sheet);overflow:hidden}
@media (min-width:640px){.board{columns:2}}
@media (min-width:1024px){.board{columns:3}}
.cell{break-inside:avoid;-webkit-column-break-inside:avoid;border-top:1px solid var(--paper-edge);padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ink{background-image:linear-gradient(var(--hlc),var(--hlc));background-repeat:no-repeat;background-size:100% 62%;background-position:0 82%;padding:0 .14em;border-radius:.2em}
.cell-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cell-head h3{font-size:var(--t-m);display:flex;align-items:center;gap:10px}
.cell-head .num{color:var(--ink-3)}
.cell-hint{font-size:var(--t-xs);color:var(--ink-2);margin-top:-6px}
.items{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.items li{line-height:1.55}
.trend{font-size:var(--t-xs);font-weight:700;margin-left:6px;white-space:nowrap}
.trend.better{color:var(--ok)} .trend.worse{color:var(--redpen)} .trend.resolved{color:var(--ink-3)}
.empty-cell{border:1.5px dashed var(--pencil);border-radius:8px;padding:12px;color:var(--ink-2);font-size:var(--t-s);display:flex;flex-direction:column;gap:10px}
.inline-add{display:flex;gap:8px}
.inline-add input{min-height:40px}
.below{display:grid;gap:24px;grid-template-columns:minmax(0,1fr);margin-top:28px}
@media (min-width:900px){.below{grid-template-columns:repeat(2,minmax(0,1fr))}}
.listing{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.listing>*{border-bottom:1px solid var(--rule);padding:10px 0}

/* Map */
.map-wrap{position:relative;height:clamp(460px,68vh,820px);border:1px solid var(--paper-edge);border-radius:4px;background:var(--paper);box-shadow:var(--shadow-sheet);overflow:hidden;touch-action:none;cursor:grab}
.map-wrap.drag{cursor:grabbing}

/* ================= example notes (fictional) ================= */
const EXAMPLE = `Initial assessment 21/10/2026 with Jordan (15, Year 9 at Westfield High School) and his mum Sarah. Referred by GP Dr Patel for low mood and school refusal since Term 3.
Jordan said "I just can't be bothered with anything anymore". Sleeping 2am to 11am most days, gaming late. Lost interest in basketball, which he used to love.
Mum and dad separated in 2023; dad moved to Queensland and contact is irregular. Mum has a history of depression.
Bullied at school since the start of Term 3, mostly on Snapchat. Has missed 12 of the last 20 school days. Eating less and skipping breakfast.
Denies alcohol and drugs; vapes occasionally with friends. Asked about suicidal thoughts: passive thoughts ("sometimes I wish I could just disappear"), no plan or intent, no self-harm.
Close to his aunt Mona, who visits weekly. Good sense of humour and enjoys drawing. Jordan wants to "feel normal again" and get back to basketball. Mum wants him back at school.
Mum's mobile 0412 345 678. DOB 3/4/2011. Lives at 14 Smith Street, Blacktown NSW 2148.`;

/* ================= copy ================= */
function copyText(text, done) {
  const ok = () => showToast(done || 'Copied. Paste it into your notes.');
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length); let worked = false;
    try { worked = document.execCommand('copy'); } catch (e) { worked = false; }
    ta.remove(); if (worked) ok(); else showCopyPanel(text);
  };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback(); } catch (e) { fallback(); }
}
function showCopyPanel(text) {
  let el = $('#copy-panel'); if (!el) { el = document.createElement('div'); el.id = 'copy-panel'; el.className = 'pop copy-panel'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Copy this text'); document.body.appendChild(el); }
  el.innerHTML = `<b>Select all and copy</b><textarea class="copybox" readonly>${esc(text)}</textarea><div class="row between"><span class="xs muted">Copying was blocked here, so select the text and copy it.</span><button class="btn sm" data-act="close-copy">Close</button></div>`;
  el.style.left = '50%'; el.style.top = '50%'; el.style.transform = 'translate(-50%,-50%)';
  const ta = el.querySelector('textarea'); ta.focus(); ta.select();
}

/* ================= actions ================= */
function go(view, caseId) { UI.view = view; UI.caseId = caseId || null; UI.pop = null; UI.confirm = null; UI.openGap = null; UI.addCat = null; render(); window.scrollTo(0, 0); }
function openCase(id) { UI.tab = 'notes'; UI.formMode = UI.formMode || 'board'; go('case', id); }
function draftOf(c) { if (!UI.draft || UI.draft.caseId !== c.id) UI.draft = { caseId: c.id, stage: 'write', text: '', opts: { manual: [], unhide: [], roles: {} }, count: true }; return UI.draft; }
/* In follow-up notes the young person is usually the one named most, so default them to YP. */
function deidFor(c, d) { return deidentify(d.text, Object.assign({ ypMin: c.entries.some(e => e.kind === 'notes') ? 1 : 2 }, d.opts)); }
function gapItem(c, key) { return checklist(c).all.find(i => i.key === key); }

async function runSort(c) {
  const d = draftOf(c); const r = deidFor(c, d); const text = r.text;
  const keep = { caseId: c.id, stage: 'write', text: d.text, opts: clone(d.opts), count: d.count };
  d.stage = 'sorting'; d.withClaude = !!(S.settings.useClaude && SAMPLE); render();
  let res = null, by = 'rules', note = null;
  if (d.withClaude) {
    const ctl = new AbortController(); UI.sortCtl = ctl;
    try { res = await sortWithClaude(c, text, ctl.signal); by = 'claude'; }
    catch (e) { if (ctl.signal.aborted) return; note = aiErrorText(e); }
    if (UI.sortCtl !== ctl) return; UI.sortCtl = null;
  }
  if (!res) res = { spans: sortByRules(text), checks: [] };
  const iv = activeInt(c);
  const e = addEntry(c, text, res.spans, { by, checks: res.checks, intId: iv && d.count ? iv.id : null });
  UI.draft = null; UI.justSorted = e.id; UI.openGap = null; UI.addOpen = false;
  if (UI.view === 'case' && UI.caseId === c.id) { render(); const el = document.getElementById('sheet-' + e.id); if (el && el.getBoundingClientRect().top > innerHeight * 0.55) el.scrollIntoView({ block: 'start' }); }
  const n = res.spans.filter(s => s.cat !== 'context').length; const left = checklist(c).open.filter(i => !i.optional).length;
  showToast(note || `Sorted ${plural(n || res.spans.length, n ? 'point' : 'line')}${n ? '' : ' as background'}. ${left ? `${left} still missing.` : 'Nothing missing.'}`, { label: 'Undo', run: () => { c.entries = c.entries.filter(x => x.id !== e.id); touch(c); UI.draft = keep; render(); } });
}
function stopSort() { if (UI.sortCtl) { UI.sortCtl.abort(); UI.sortCtl = null; } const d = UI.draft; if (d) d.stage = 'review'; render(); }

function gapSave(c, key, text, quickIdx) {
  const it = gapItem(c, key); if (!it) return;
  let raw = text, neg = false;
  if (quickIdx != null) { raw = it.quick[quickIdx]; neg = it.group === 'safety' && quickIdx === 0; }
  raw = String(raw || '').trim(); if (!raw) { const el = $('#gap-in'); if (el) el.focus(); return; }
  if (it.group === 'probe' && quickIdx == null) raw = `${it.title.replace(/\?$/, '')}: ${raw}`;
  let cat = it.cat || 'context';
  if (!(it.group === 'formulation' || it.group === 'safety')) { const guess = catOf(raw); if (guess !== 'context') cat = guess; }
  const topics = Array.from(new Set([...(it.topics || []), ...topicsOf(raw)]));
  const r = addQuick(c, raw, cat, topics, { neg });
  const prev = c.check[key]; c.check[key] = { s: 'done', date: todayISO() }; touch(c);
  UI.openGap = null; render();
  showToast(r.hidden ? `Added, with ${plural(r.hidden, 'detail')} hidden.` : 'Added.', { label: 'Undo', run: () => { c.entries = c.entries.filter(x => x.id !== r.entry.id); if (prev) c.check[key] = prev; else delete c.check[key]; touch(c); render(); } });
}
function setCheck(c, key, s) {
  const prev = c.check[key];
  if (s == null) delete c.check[key]; else c.check[key] = { s, date: todayISO() };
  touch(c); UI.openGap = null; render();
  if (s === 'na') showToast('Marked not relevant.', { label: 'Undo', run: () => { if (prev) c.check[key] = prev; else delete c.check[key]; touch(c); render(); } });
}
function savePopShort() {
  const c = current(); const p = UI.pop; if (!p || !c) return;
  const f = findSpan(c, p.spanId); const inp = $('#pop-short'); if (f && inp && inp.value.trim() && inp.value.trim() !== f.s.short) { f.s.short = inp.value.trim().slice(0, 140); touch(c); }
}
function closePop(save) {
  if (!UI.pop) return; if (save) savePopShort();
  UI.pop = null; render();
}
function openPop(id, target) {
  const rects = target.getClientRects(); UI.pop = { spanId: id, rect: rects.length ? rects[0] : target.getBoundingClientRect() };
  $$('.sel').forEach(x => x.classList.remove('sel')); target.classList.add('sel'); renderPop();
  const inp = $('#pop .opt[aria-pressed="true"]') || $('#pop .opt'); if (inp && !matchMedia('(pointer:coarse)').matches) inp.focus();
}
function removeEntry(c, id) {
  const i = c.entries.findIndex(x => x.id === id); if (i < 0) return; const [e] = c.entries.splice(i, 1);
  touch(c); UI.confirm = null; render();
  showToast(e.kind === 'quick' ? 'Line deleted.' : 'Notes deleted.', { label: 'Undo', run: () => { c.entries.splice(i, 0, e); touch(c); render(); } });
}

const ACT = {
  home: () => go('home'),
  settings: () => go('settings'),
  'new-case': () => { UI.newCase = true; UI.focus = 'nc-label'; render(); },
  'cancel-new': () => { UI.newCase = false; render(); },
  example: () => { const c = newCase('J.M. (example)', 15); S.cases.push(c); touch(c); openCase(c.id); const d = draftOf(c); d.text = EXAMPLE; render(); },
  'open-case': el => openCase(el.dataset.id),
  'copy-summary': () => { const c = current(); if (c) copyText(buildSummary(c), 'Summary copied. Paste it into your notes.'); },
  tab: el => { UI.tab = el.dataset.tab; UI.pop = null; UI.confirm = null; render(); },
  'risk-reviewed': () => { const c = current(); c.riskSeen = Array.from(new Set([...(c.riskSeen || []), ...riskSpans(c).map(s => s.id)])); c.safetyReviewed = todayISO(); touch(c); render(); },
  'add-open': () => { UI.addOpen = true; UI.focus = 'paste'; render(); },
  'example-fill': () => { const c = current(); const d = draftOf(c); d.text = EXAMPLE; UI.focus = null; render(); },
  'to-review': () => { const c = current(); const d = draftOf(c); const ta = $('#paste'); if (ta) d.text = ta.value; if (!d.text.trim()) return; d.stage = 'review'; render(); window.scrollTo(0, Math.min(scrollY, $('#main').offsetTop)); },
  'to-write': () => { const d = draftOf(current()); d.stage = 'write'; render(); },
  unhide: el => {
    const c = current(); const d = draftOf(c); const key = el.dataset.key; const p = d.result && d.result.people.find(x => x.key === key);
    const add = p ? p.origs.flatMap(o => o.split(/\s+/)).map(w => w.replace(/['’]s$/i, '').replace(/[^A-Za-z'’-]/g, '')).filter(w => w && !TITLES[w.toLowerCase().replace('.', '')]) : [key];
    d.opts.unhide = Array.from(new Set([...d.opts.unhide, ...add])); d.opts.manual = d.opts.manual.filter(w => !add.some(a => a.toLowerCase() === w.toLowerCase())); render();
  },
  'hide-word': el => { const d = draftOf(current()); const w = el.dataset.w; if (!w) return; d.opts.manual = Array.from(new Set([...d.opts.manual, w])); d.opts.unhide = d.opts.unhide.filter(x => x.toLowerCase() !== w.toLowerCase()); render(); },
  sort: () => runSort(current()),
  'stop-sort': stopSort,
  span: el => { const id = el.dataset.id; if (UI.pop && UI.pop.spanId === id) return closePop(true); if (UI.pop) savePopShort(); openPop(id, el); },
  refile: el => {
    const c = current(); const f = UI.pop && findSpan(c, UI.pop.spanId); if (!f) return;
    const inp = $('#pop-short'); if (inp && inp.value.trim()) f.s.short = inp.value.trim().slice(0, 140);
    const prev = f.s.cat; const cat = el.dataset.cat; if (prev === cat) return closePop(false);
    f.s.cat = cat; f.s.by = 'worker'; touch(c); UI.pop = null; render();
    showToast(`Moved to ${cat === 'positive' ? 'Strengths' : CATS[cat].label}.`, { label: 'Undo', run: () => { f.s.cat = prev; touch(c); render(); } });
  },
  unhighlight: () => {
    const c = current(); const f = UI.pop && findSpan(c, UI.pop.spanId); if (!f) return;
    const i = f.e.spans.indexOf(f.s); f.e.spans.splice(i, 1); let gone = null;
    if (f.e.kind === 'quick' && !f.e.spans.length) { gone = c.entries.indexOf(f.e); c.entries.splice(gone, 1); }
    touch(c); UI.pop = null; render();
    showToast('Highlight removed.', { label: 'Undo', run: () => { f.e.spans.splice(i, 0, f.s); if (gone != null) c.entries.splice(gone, 0, f.e); touch(c); render(); } });
  },
  'pop-done': () => closePop(true),
  'copy-entry': el => { const c = current(); const e = c.entries.find(x => x.id === el.dataset.id); if (e) copyText(buildEntryNote(c, e), 'Sorted notes copied.'); },
  'del-entry': el => { const c = current(); const e = c.entries.find(x => x.id === el.dataset.id); if (!e) return; if (e.kind === 'quick') removeEntry(c, e.id); else { UI.confirm = 'e:' + e.id; render(); } },
  'del-entry-yes': el => removeEntry(current(), el.dataset.id),
  'cancel-confirm': () => { UI.confirm = null; render(); },
  'copy-next': () => { const c = current(); copyText(buildNextList(c), 'List copied.'); },
  gap: el => { const k = el.dataset.key; UI.openGap = UI.openGap === k ? null : k; render(); },
  'gap-quick': el => gapSave(current(), el.dataset.key, null, Number(el.dataset.n)),
  'gap-save': el => { const t = $('#gap-in'); gapSave(current(), el.dataset.key, t ? t.value : ''); },
  'gap-next': el => { const c = current(); const k = el.dataset.key; setCheck(c, k, c.check[k] && c.check[k].s === 'next' ? null : 'next'); },
  'gap-na': el => setCheck(current(), el.dataset.key, 'na'),
  'gap-undo': el => setCheck(current(), el.dataset.key, null),
  'form-mode': el => { UI.formMode = el.dataset.mode; UI.pop = null; render(); },
  'add-cat': el => { UI.addCat = el.dataset.cat; UI.focus = 'add-' + el.dataset.cat; render(); },
  'map-toggle': el => { const c = current(); const k = c.id + ':' + el.dataset.cat; UI.mapOpen[k] = UI.mapOpen[k] === false; render(); },
  'map-missing': el => { UI.tab = 'notes'; UI.openGap = el.dataset.key; render(); const g = $('.gap-row[aria-expanded="true"]'); if (g) g.scrollIntoView({ block: 'center' }); },
  'map-zoom': el => { const c = current(); const z = el.dataset.z; if (z === 'fit') { mapFit(c); mapApply(c); } else mapZoom(c, z === 'in' ? 1.25 : 0.8); },
  'start-int': el => {
    const c = current(); const type = el.dataset.type; const def = INT_BY[type]; const sel = $('#var-' + type);
    const variant = sel ? sel.value : def.variants[0].id; const iv = activeInt(c); if (iv) iv.end = todayISO();
    c.ints.push({ id: uid('i'), type, variant, start: todayISO(), end: null }); touch(c); UI.openOpt = null; render(); window.scrollTo(0, 0);
    showToast(`${variantOf(c.ints[c.ints.length - 1]).name} started. New notes will count as sessions.`);
  },
  'stop-int': () => { UI.confirm = 'stop-int'; render(); },
  'stop-int-yes': () => { const c = current(); const iv = activeInt(c); if (iv) iv.end = todayISO(); UI.confirm = null; touch(c); render(); },
  'goal-progress': el => { const c = current(); c.goalProgress[el.dataset.id] = el.dataset.v; touch(c); render(); },
  'del-case': () => { UI.confirm = 'del-case'; UI.adminOpen = true; render(); },
  'del-case-yes': () => { const c = current(); S.cases = S.cases.filter(x => x.id !== c.id); dirty.add(c.id); flush(c.id); UI.adminOpen = false; go('home'); showToast(`${c.label} deleted.`); },
  'copy-export': () => copyText(JSON.stringify(S.cases, null, 1), 'All cases copied. Keep the backup somewhere safe.'),
  import: () => {
    const t = $('#import'); let data; try { data = JSON.parse(t.value); } catch (e) { return showToast('That backup could not be read.'); }
    if (!Array.isArray(data)) return showToast('That backup could not be read.');
    let n = 0; data.forEach(x => { if (!x || !x.id || !Array.isArray(x.entries)) return; const ex = S.cases.find(c => c.id === x.id); const c = normalise(clone(x)); if (ex) Object.assign(ex, c); else S.cases.push(c); touch(ex || c); n++; });
    render(); showToast(n ? `Restored ${plural(n, 'case')}.` : 'No cases found in that backup.');
  },
  wipe: () => { UI.confirm = 'wipe'; render(); },
  'wipe-yes': () => { const ids = S.cases.map(c => c.id); S.cases = []; ids.forEach(id => { dirty.add(id); flush(id); }); UI.confirm = null; go('home'); showToast('All cases deleted.'); },
  'toast-action': () => { const run = UI.toastAction; const el = $('#toast'); if (el) el.hidden = true; UI.toastAction = null; if (run) run(); },
  'close-copy': () => { const el = $('#copy-panel'); if (el) el.remove(); }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (UI.pop && !e.target.closest('#pop') && !(t && t.dataset.act === 'span')) closePop(true);
  if (!t) return;
  if (t.closest('#map-wrap') && UI.mapDragged) { UI.mapDragged = false; return; }
  if (t.tagName === 'A') return;
  const fn = ACT[t.dataset.act]; if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#copy-panel')) return ACT['close-copy']();
    if (UI.pop) return closePop(true);
    if (UI.confirm) { UI.confirm = null; return render(); }
    if (UI.openGap) { UI.openGap = null; return render(); }
    return;
  }
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[role="button"][data-act]') && t.tagName !== 'BUTTON') { e.preventDefault(); const fn = ACT[t.dataset.act]; if (fn) fn(t, e); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && t.id === 'paste') { e.preventDefault(); ACT['to-review'](); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && t.id === 'gap-in') { e.preventDefault(); const b = $('[data-act="gap-save"]'); if (b) ACT['gap-save'](b); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'paste') { const c = current(); if (!c) return; const d = draftOf(c); d.text = t.value; const b = $('#to-review'); if (b) b.disabled = !t.value.trim(); }
});
document.addEventListener('change', e => {
  const t = e.target; const c = current();
  if (t.dataset.role != null && c) { const d = draftOf(c); d.opts.roles[t.dataset.role] = t.value; if (!t.value) delete d.opts.roles[t.dataset.role]; render(); }
  else if (t.id === 'count-int' && c) draftOf(c).count = t.checked;
  else if (t.id === 'use-claude') { S.settings.useClaude = t.checked; saveSettings(); }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === 'new-case') {
    const label = $('#nc-label').value.trim(); if (!label) return $('#nc-label').focus();
    const c = newCase(label, $('#nc-age').value); S.cases.push(c); touch(c); UI.newCase = false; UI.focus = 'paste'; openCase(c.id);
  } else if (f.dataset.form === 'add-item') {
    const c = current(); const cat = f.dataset.cat; const inp = f.querySelector('input'); const v = inp.value.trim(); if (!v) return inp.focus();
    const r = addQuick(c, v, cat); UI.addCat = cat; UI.focus = inp.id; render();
    showToast(r.hidden ? `Added, with ${plural(r.hidden, 'detail')} hidden.` : `Added to ${cat === 'goal' ? 'Goals' : CATS[cat].label}.`, { label: 'Undo', run: () => { c.entries = c.entries.filter(x => x.id !== r.entry.id); touch(c); render(); } });
  } else if (f.dataset.form === 'edit-case') {
    const c = current(); const label = $('#ec-label').value.trim(); if (!label) return;
    c.label = label.slice(0, 40); const age = $('#ec-age').value; c.age = age ? Number(age) : null; touch(c); UI.adminOpen = false; render(); showToast('Case details saved.');
  }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!(d instanceof HTMLDetailsElement)) return;
  if (d.dataset.opt) { if (d.open) UI.openOpt = d.dataset.opt; else if (UI.openOpt === d.dataset.opt) UI.openOpt = null; }
  if (d.classList.contains('case-admin')) UI.adminOpen = d.open;
  if (d.dataset.more === 'opt') UI.optOpen = d.open;
}, true);
window.addEventListener('resize', () => { if (UI.pop) closePop(true); });
document.addEventListener('scroll', () => { if (UI.pop && !$('#pop:focus-within')) closePop(true); }, { passive: true });

boot();

</script>
</body>
